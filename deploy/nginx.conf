# /etc/nginx/sites-available/ivamarg — substituir gestao.ivamarg.ao pelo domínio real.
# Certificado: sudo certbot --nginx -d gestao.ivamarg.ao
limit_req_zone $binary_remote_addr zone=ivamarg_login:10m rate=10r/m;

server {
  listen 80;
  server_name gestao.ivamarg.ao;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name gestao.ivamarg.ao;

  ssl_certificate     /etc/letsencrypt/live/gestao.ivamarg.ao/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gestao.ivamarg.ao/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # microfone: chamadas WhatsApp no browser; câmara: leitura de QR no chão de fábrica
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

  client_max_body_size 21m; # documentos até 20 MB
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  root /srv/ivamarg/apps/web/dist;

  location /api/auth/login {
    limit_req zone=ivamarg_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/proxy_params;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/proxy_params;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: todas as rotas do frontend servem o index.html
  location / {
    try_files $uri /index.html;
  }
}
